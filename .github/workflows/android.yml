name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create release as draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check-version:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
      version_changed: ${{ steps.check_file.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get version
        id: get_version
        run: |
          # Extract and normalize version from VERSION file (strip whitespace, leading 'v')
          VERSION=$(tr -d '[:space:]' < VERSION | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Validate VERSION format
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: VERSION file has invalid format: '$VERSION'"
            exit 1
          fi
          echo "Validated version: $VERSION"
      - name: Check Tag
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Check if VERSION changed
        id: check_file
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD | grep -q "^VERSION$"; then
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Module
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :module:zipRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZygiskLoader-Release
          path: module/release/*.zip 
          if-no-files-found: error
          retention-days: 7

  deploy-release:
    name: Deploy Full Release
    needs: [check-version, build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.check-version.outputs.version_changed == 'true' &&
      needs.check-version.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ZygiskLoader-Release
          path: out

      - name: Validate cliff config exists
        # Using `test -f` instead of a dedicated action step — clean and minimal.
        # Fatal because the next step (changelog generation) will fail without it.
        run: test -f .github/external/cliff.toml || { echo "::error::cliff.toml not found"; exit 1; }

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git_cliff
        with:
          config: .github/external/cliff.toml
          args: --verbose --unreleased --tag v${{ needs.check-version.outputs.version }} --strip all
        env:
          OUTPUT: CHANGELOG.md

      - name: Generate update.json
        run: |
          # Reuse version from check-version job output to avoid re-parsing VERSION file
          VERSION="${{ needs.check-version.outputs.version }}"
          VERSION_CODE=$(./gradlew -q printVersionCode)
          # Validate versionCode before generating JSON — prevents invalid output
          # on Gradle failure (which would produce invalid JSON like "versionCode": ,)
          # Also validate that versionCode is a positive integer (reject deprecation
          # warnings or other Gradle output that may leak into the captured value).
          if ! echo "$VERSION_CODE" | grep -qE '^[0-9]+$'; then
            echo "ERROR: invalid versionCode: '$VERSION_CODE'"
            exit 1
          fi
          # Build URL variable for use in JSON
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/zygisk-loader-v${VERSION}-release.zip"
          printf '{\n  "version": "v%s",\n  "versionCode": %s,\n  "zipUrl": "%s",\n  "changelog": "https://raw.githubusercontent.com/%s/main/CHANGELOG.md"\n}\n' \
            "$VERSION" "$VERSION_CODE" "$ZIP_URL" "${{ github.repository }}" > update.json
          echo "Generated update.json with versionCode=${VERSION_CODE}"

      - name: Include update.json in release
        run: cp update.json out/

      - name: Commit update.json and CHANGELOG.md to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update update.json and CHANGELOG.md for v${{ needs.check-version.outputs.version }} [skip ci]"
            git push
          else
            echo "Nothing to commit — files unchanged"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Release v${{ needs.check-version.outputs.version }}
          body: ${{ steps.git_cliff.outputs.content }}
          files: |
            out/*.zip
            out/update.json
          draft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
