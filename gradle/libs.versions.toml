[versions]
agp = "8.11.0"
# Pin NDK for reproducibility. Update when stable NDK releases are available
# (check: https://github.com/android/ndk/wiki/Unsupported-Downloads).
# Last NDK update tested: 2025-03-15 (r29). Verify C17 language features and
# sanitizer compatibility when bumping.
# r30 is used because this machine's r29 install only ships linux-x86_64
# prebuilts, which cannot run on the arm64 host chroot.
ndk = "30.0.14904198"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
